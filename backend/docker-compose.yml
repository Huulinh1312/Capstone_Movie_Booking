services:
  mysql:
    image: mysql:8.4
    container_name: movie-booking-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: movie_booking
      MYSQL_USER: movie_user
      MYSQL_PASSWORD: movie_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - movie_mysql_data:/var/lib/mysql

volumes:
  movie_mysql_data:
